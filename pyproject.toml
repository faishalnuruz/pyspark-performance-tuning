[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-performance-tuning"
version = "0.1.0"
description = "A naive and an optimised PySpark job over skewed nested telemetry, with the measurement that proves the difference."
requires-python = ">=3.11"
dependencies = [
  "pyspark>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
spark-tuning-benchmark = "spark_tuning.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
